# Local stack: Postgres + the API. Run:  docker compose up --build   (API at http://localhost:8000/docs)
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: outreach
      POSTGRES_PASSWORD: outreach
      POSTGRES_DB: outreach
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U outreach"]
      interval: 5s
      retries: 10
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://outreach:outreach@db:5432/outreach
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
volumes:
  pgdata:
