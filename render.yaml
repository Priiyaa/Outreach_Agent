# Render Blueprint: the API. In Render choose New > Blueprint and point it at this repo.
# Secrets marked `sync: false` are asked for in the dashboard; they are never stored in git.
services:
  - type: web
    name: outreach-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL        # from your Postgres host, e.g. postgresql+psycopg2://user:pass@host/db?sslmode=require
        sync: false
      - key: WRITE_TOKEN         # the access code people type to unlock editing
        sync: false
      - key: CORS_ORIGINS        # JSON list with your Vercel URL, e.g. ["https://your-app.vercel.app"]
        sync: false
      - key: ALLOW_FETCH         # the free plan sleeps, so fetching is done by the scheduled GitHub Action
        value: "false"
      - key: PROFILE_YAML        # same text as the PROFILE_YAML GitHub secret, so the board shows your match scores
        sync: false
