name: Daily fetch
# Pulls new postings, labels them and (if configured) runs the LLM stage, writing straight to the hosted database.
# Needs the repository secret DATABASE_URL. GEMINI_API_KEY is optional.
on:
  schedule:
    - cron: "0 12 * * *"      # every day at 12:00 UTC
  workflow_dispatch:           # also runnable by hand from the Actions tab

concurrency:
  group: fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      PROFILE_YAML: ${{ secrets.PROFILE_YAML }}  # your config/profile.yaml contents; optional
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Check the secret is set
        run: test -n "$DATABASE_URL" || (echo "Add the DATABASE_URL repository secret first" && exit 1)
      - run: alembic upgrade head
      - run: python -m app.cli fetch
      - run: python -m app.cli llm-classify
      - name: Re-rank jobs for your profile (the one saved on the board, else PROFILE_YAML; skipped if neither)
        run: python -m app.cli match --top 0
      - run: python -m app.cli stats
