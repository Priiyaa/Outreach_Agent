# These are rough sizes from general knowledge, NOT verified, and several sit near a cutoff.
# Companies not listed here are sized from their job text, then by Claude (if ANTHROPIC_API_KEY is set),
# then default to Startup/Small. You can also change any company in the app's Companies tab; a size you set
# there always wins over this file.

