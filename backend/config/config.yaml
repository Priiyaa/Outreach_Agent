db_path: data/outreach.db
export_dir: data/exports

http:
  timeout_s: 30
  workers: 8          # parallel company fetches; keep modest to be polite to the ATS APIs
  user_agent: "outreach-agent/0.1 (personal job search tool)"

# Optional second-opinion pass on jobs the rules are unsure about. provider: none turns it off (nothing is sent).
# For gemini: put GEMINI_API_KEY in backend/.env and check the model name is current.
llm:
  provider: gemini      # none | gemini
  model: gemini-3.5-flash-lite
  requests_per_minute: 12   # free tier allows 15; stay under it
  max_calls_per_run: 100   # requests per run, up to 10 postings each; the free tier allows 500 requests a day
