[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501", "B008"]  # B008: Depends()/Query() in defaults is how FastAPI works

[tool.ruff.lint.per-file-ignores]
# cell() is defined and called inside the same loop iteration, so it never sees a stale `cols`/`cells`.
"app/sources/lists.py" = ["B023"]
